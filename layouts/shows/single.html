{{ define "main" }}
  <p class="back"><a href="/shows/">← All shows</a></p>
  <h1>{{ .Title }}</h1>
  <p class="show-meta">
    <time datetime="{{ .Date.Format "2006-01-02T15:04" }}">{{ .Date.Format "Monday, January 2, 2006 · 3:04 PM" }}</time>
    {{ with .Params.venue }}<br>{{ . }}{{ end }}
    {{ with .Params.address }}<br>{{ . }}{{ end }}
  </p>
  {{ .Content }}
{{ end }}
